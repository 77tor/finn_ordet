<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finn ordet</title>
    <link rel="icon" type="image/png" href="finn_ordet_01.svg">
    <link rel="apple-touch-icon" href="finn_ordet_01.svg">
    
    <!-- Eksterne biblioteker -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Eget stilark -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- --- SIDEBAR --- -->
<div class="sidebar">
    <div class="sidebar-header" style="display: flex; align-items: center; margin-bottom: 20px;">
        <div class="menu-container" style="margin-bottom: 0; margin-right: 15px;">
            <div class="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div id="myDropdown" class="dropdown-menu">
                <a href="https://77tor.github.io/bingo/" target="_self">
                    <img src="bingo_02.png" class="menu-icon" alt="Bingo"> Bingo
                </a>
                <a href="https://77tor.github.io/gitter/" target="_self">
                    <img src="gitter_02.png" class="menu-icon" alt="Gitter-ord"> Gitter-ord
                </a>
                <a href="https://77tor.github.io/les_og_skriv/" target="_self">
                    <img src="les_skriv.png" class="menu-icon" alt="Les og skriv"> Les og skriv
                </a>
                <a href="https://77tor.github.io/ord-sok/" target="_self"> 
                    <img src="ord-sok.png" class="menu-icon" alt="Ordsøk"> Ordsøk
                </a>
                <a href="https://77tor.github.io/Silhuettord/" target="_self">
                    <img src="silhuett-ord_05.png" class="menu-icon" alt="Silhuett-ord"> Silhuett-ord
                </a>
                <a href="https://77tor.github.io/Stavelser/" target="_self">
                    <img src="stavelser_01.png" class="menu-icon" alt="Stavelser"> Stavelser
                </a>
            </div>
        </div>
        <h2 style="margin: 0; flex-grow: 1; text-align: center; letter-spacing: 1px;">Dra strek</h2>
    </div>

    <!-- Bildestørrelse -->
<div class="control-item">
    <label for="image-size">Bildestørrelse:</label>
    <select id="image-size" onchange="oppdaterVisning()">
        <option value="40">Liten</option>
        <option value="55" selected>Middels</option>
        <option value="70">Stor</option>
    </select>
</div>

    <!-- Skriftstørrelse -->
    <div class="control-item">
        <label for="font-size">Skriftstørrelse:</label>
        <select id="font-size" onchange="oppdaterVisning()">
            <option value="20">Liten</option>
            <option value="24" selected>Medium</option>
            <option value="28">Stor</option>
            <option value="32">Extra stor</option>
        </select>
    </div>

    <!-- Font-valg -->
    <div class="control-item">
        <label for="font-family">Skrifttype:</label>
        <select id="font-family" onchange="oppdaterVisning()">
            <option value="'Trykkskrift', sans-serif">Trykkskrift</option>
            <option value="'Skogstavskrift', sans-serif">Skogstavskrift</option>
            <option value="'Andika', sans-serif">Andika</option>
           <option value="'Courier New', Courier, monospace">Monospace</option>
           <option value="'Comic Sans MS', cursive">Comic Sans</option>
           <option value="Arial, sans-serif">Arial</option>
        </select>
    </div>

    <!-- Brytere (Switches) -->
    <div class="control-item">
        <span>STORE BOKSTAVER</span>
        <label class="switch">
            <input type="checkbox" id="toggle-upper" onchange="oppdaterVisning()">
            <span class="slider"></span>
        </label>
    </div>

    <div class="control-item">
        <span>Fet skrift</span>
        <label class="switch">
            <input type="checkbox" id="toggle-bold" onchange="oppdaterVisning()">
            <span class="slider"></span>
        </label>
    </div>

    <div class="control-item">
        <span>Vis fasit på arket</span>
        <label class="switch">
            <input type="checkbox" id="toggle-fasit" onchange="oppdaterVisning()">
            <span class="slider"></span>
        </label>
    </div>

<!-- Stokke om rekkefølge -->
<div class="control-item">
    <span>Stokke om rekkefølge</span>
    <label class="switch">
        <input type="checkbox" id="toggle-shuffle" onchange="oppdaterVisning()" checked>
        <span class="slider"></span>
    </label>
</div>

    <br>

<!-- Hovedknapper nederst -->
    <div style="display: flex; gap: 6px; margin-top: auto; width: 100%;">
        <button class="action-btn" style="background-color: #27ae60; flex: 2; padding: 10px 4px; margin: 0;" onclick="apneOrdModal()">
            Velg ord
        </button>
        <button class="action-btn" style="background-color: #e74c3c; flex: 1; padding: 10px 4px; margin: 0;" onclick="resetForm()">
            Nullstill
        </button>
        <button class="action-btn" style="background-color: #2980b9; flex: 1; padding: 10px 4px; margin: 0;" onclick="window.print()">
            Skriv ut
        </button>
    </div>
</div>

<div class="main-content">
    <!-- Bakgrunnsbilde ved oppstart / nullstilling -->
    <div id="placeholder-image" style="display: flex; justify-content: center; align-items: center; width: 100%; height: 80vh;">
        <img src="finn_ordet_01.svg" alt="Velkomstbilde" style="max-width: 400px; opacity: 0.15; filter: grayscale(100%);">
    </div> 

    <!-- Selve oppgavearket (skjules når siden åpnes) -->
    <div id="capture-area" style="display: none;">
        <div id="output-container"></div>
    </div>
</div>

<!-- ORD- OG BILDE-MODAL -->
<div id="ord-modal" class="modal-overlay">
    <div class="modal-content">
        
        <!-- TOPPBAR -->
        <div class="modal-header">
            <h2>Ord- og bildeutvalg</h2>
            <button class="modal-close" onclick="lukkOrdModal()">&times;</button>
        </div>

        <!-- HOVEDINNHOLD (2-KOLONNER) -->
        <div style="display: flex; gap: 20px; flex: 1; overflow: hidden; margin-top: 10px;">
            
            <!-- VENSTREKOLONNE: VALGTE ORD -->
            <div class="fane-venstre">
                <h3 style="margin: 0; font-size: 1.05rem; border-bottom: 1px solid #ccc; padding-bottom: 5px;">
                    Valgte ord (<span id="antall-valgte">0</span>)
                </h3>
                <ul id="mine-ord-liste" class="mine-ord-liste"></ul>
            </div>

            <!-- HØYREKOLONNE: SØKEFELT & GRID -->
            <div class="fane-hoyre">
                
                <!-- Faner -->
                <div class="modal-tabs" style="margin: 0 0 10px 0;">
                    <button class="tab-btn active" onclick="byttFane('database')">Bilde-database</button>
                    <button class="tab-btn" onclick="byttFane('egne')">Legg til egne ord</button>
                </div>

                <!-- Fane 1: Bilde-database -->
                <div id="fane-database" class="tab-content active">
                    <input type="text" id="modal-sok" placeholder="Søk i databasen..." oninput="filtrerDatabaseGrid()">
                    <div id="database-grid" class="ord-grid"></div>
                </div>

                <!-- Fane 2: Legg til egne ord -->
                <div id="fane-egne" class="tab-content" style="flex-direction: column; gap: 10px;">
                    <textarea id="custom-word-input" placeholder="Skriv ord her (separer med komma eller linjeskift)..." style="width: 100%; height: 80px; padding: 8px; box-sizing: border-box;"></textarea>
                    <label style="font-size: 0.9rem;">Last opp bilde (valgfritt):</label>
                    <input type="file" id="custom-image-upload" accept="image/*">
                    <button onclick="leggTilEgetOrd()" class="action-btn" style="background: #27ae60; width: auto; align-self: flex-start;">Legg til i utvalg</button>
                </div>

            </div>
        </div>

        <!-- BUNNBAR MED KNAPPER -->
        <div class="modal-footer">
            <button onclick="lukkOrdModal()" class="action-btn" style="background: #718096; width: auto;">Avbryt</button>
            <button onclick="lagreModalValg()" class="action-btn" style="background: #27ae60; width: auto;">Bruk valgte ord</button>
        </div>

    </div>
</div>

<!-- Kun app.js trenger å importeres -->
<script type="module" src="app.js"></script>

</body>
</html>
