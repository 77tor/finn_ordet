<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finn ordet</title>
    <link rel="icon" type="image/png" href="Bilder/finn_ordet_icon.png">
    <link rel="apple-touch-icon" href="Bilder/finn_ordet_icon.png">
    
    <!-- Eksterne biblioteker -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Eget stilark -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- --- SIDEBAR --- -->
<div class="sidebar">
    <div class="sidebar-header" style="display: flex; align-items: center; margin-bottom: 20px;">
        <div class="menu-container" style="margin-bottom: 0; margin-right: 15px;">
            <div class="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div id="myDropdown" class="dropdown-menu">
                <a href="https://77tor.github.io/bingo/" target="_self">
                    <img src="bingo_02.png" class="menu-icon" alt="Bingo"> Bingo
                </a>
                <a href="https://77tor.github.io/gitter/" target="_self">
                    <img src="gitter_02.png" class="menu-icon" alt="Gitter-ord"> Gitter-ord
                </a>
                <a href="https://77tor.github.io/les_og_skriv/" target="_self">
                    <img src="les_skriv_03.png" class="menu-icon" alt="Les og skriv"> Les og skriv
                </a>
                <a href="https://77tor.github.io/ord-sok/" target="_self"> 
                    <img src="ord-sok.png" class="menu-icon" alt="Ordsøk"> Ordsøk
                </a>
                <a href="https://77tor.github.io/Silhuettord/" target="_self">
                    <img src="silhuett-ord_05.png" class="menu-icon" alt="Silhuett-ord"> Silhuett-ord
                </a>
                <a href="https://77tor.github.io/Stavelser/" target="_self">
                    <img src="stavelser_01.png" class="menu-icon" alt="Stavelser"> Stavelser
                </a>
            </div>
        </div>
        <h2 style="margin: 0; flex-grow: 1; text-align: center; letter-spacing: 1px;">Dra strek</h2>
    </div>

    <!-- Skriftstørrelse -->
    <div class="control-item">
        <label for="font-size">Skriftstørrelse:</label>
        <select id="font-size" onchange="generateStaveKryss(false)">
            <option value="20">Liten</option>
            <option value="24" selected>Medium</option>
            <option value="28">Stor</option>
            <option value="32">Extra stor</option>
        </select>
    </div>

    <!-- Font-valg -->
    <div class="control-item">
        <label for="font-family">Skrifttype:</label>
        <select id="font-family" onchange="generateStaveKryss(false)">
            <option value="'Trykkskrift', sans-serif">Trykkskrift</option>
            <option value="'Skogstavskrift', sans-serif">Skogstavskrift</option>
            <option value="'Andika', sans-serif">Andika</option>
        </select>
    </div>

    <!-- Brytere (Switches) -->
    <div class="control-item">
        <span>STORE BOKSTAVER</span>
        <label class="switch">
            <input type="checkbox" id="toggle-upper" onchange="generateStaveKryss(false)">
            <span class="slider"></span>
        </label>
    </div>

    <div class="control-item">
        <span>Fet skrift</span>
        <label class="switch">
            <input type="checkbox" id="toggle-bold" onchange="generateStaveKryss(false)">
            <span class="slider"></span>
        </label>
    </div>

    <div class="control-item">
        <span>Vis fasit på arket</span>
        <label class="switch">
            <input type="checkbox" id="toggle-fasit" onchange="generateStaveKryss(false)">
            <span class="slider"></span>
        </label>
    </div>

    <!-- Ny bryter: Stokke om rekkefølge -->
    <div class="control-item">
        <span>Stokke om rekkefølge</span>
        <label class="switch">
            <input type="checkbox" id="toggle-shuffle" onchange="generateStaveKryss(false)">
            <span class="slider"></span>
        </label>
    </div>

    <br>

    <!-- Hovedknapper nederst (tre på rad) -->
    <div style="display: flex; gap: 6px; margin-top: auto;">
        <button class="action-btn" style="background-color: #27ae60; flex: 1; padding: 10px 4px;" onclick="apneOrdModal()">
            Velg ord
        </button>
        <button class="action-btn" style="background-color: #e74c3c; flex: 1; padding: 10px 4px;" onclick="resetForm()">
            Nullstill
        </button>
        <button class="action-btn" style="background-color: #2980b9; flex: 1; padding: 10px 4px;" onclick="window.print()">
            Skriv ut
        </button>
    </div>
</div>
<div class="main-content">
    <div id="placeholder-image" style="display: flex; justify-content: center; align-items: center; width: 100%; height: 80vh;">
        <img src="Bilder/finn_ordet_bg.png" alt="Velkomstbilde" style="max-width: 400px; opacity: 0.15; filter: grayscale(100%);">
    </div> 

    <div id="capture-area">
        <img src="Bilder/finn_ordet_bg.png" id="watermark" alt="Vannmerke">
        <div id="output-container"></div>
    </div>
</div>

<!-- MODAL STRUKTUR -->
<div id="ord-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Ord- og bildeutvalg</h2>
            <button class="modal-close" onclick="lukkOrdModal()">&times;</button>
        </div>

        <!-- Fane-navigasjon -->
        <div class="modal-tabs">
            <button class="tab-btn active" onclick="byttFane('database')">Velg fra liste</button>
            <button class="tab-btn" onclick="byttFane('egne')">Legg til egne ord/bilder</button>
        </div>

        <!-- Fane 1: Database -->
        <div id="fane-database" class="tab-content active">
            <input type="text" id="modal-sok" placeholder="Søk etter ord..." oninput="filtrerDatabaseGrid()">
            <div id="database-grid" class="ord-grid">
                <!-- Fylles dynamisk med JS -->
            </div>
        </div>

        <!-- Fane 2: Egne ord og opplasting -->
        <div id="fane-egne" class="tab-content">
            <div class="custom-input-group">
                <label for="custom-word-input">Skriv inn ord (separer med komma eller linjeskift):</label>
                <textarea id="custom-word-input" rows="3" placeholder="f.eks. bil, hus, katt"></textarea>
            </div>
            
            <div class="custom-input-group" style="margin-top: 10px;">
                <label for="custom-image-upload">Last opp eget bilde (valgfritt):</label>
                <input type="file" id="custom-image-upload" accept="image/*">
            </div>

            <button type="button" onclick="leggTilEgetOrd()" class="action-btn" style="margin-top: 10px; background-color: #3498db;">Legg til i utvalg</button>

            <h3 style="margin-top: 15px;">Dine egne/valgte ord:</h3>
            <ul id="mine-ord-liste" class="mine-ord-liste">
                <!-- Viser manuelt tillagte ord -->
            </ul>
        </div>

        <div class="modal-footer">
            <button class="action-btn" style="background-color: #7f8c8d;" onclick="lukkOrdModal()">Avbryt</button>
            <button class="action-btn" style="background-color: var(--accent-green);" onclick="lagreModalValg()">Bruk valgte ord</button>
        </div>
    </div>
</div>

<!-- Koble til app.js som en module -->
<script type="module" src="app.js"></script>
</body>
</html>
